spring.application.name=autoloc-api
server.port=8089
server.servlet.context-path=/gestionprojets

# Connexion a la base de donnees (mot de passe via variable d'environnement DB_PASSWORD, vide par defaut)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db_v2?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO